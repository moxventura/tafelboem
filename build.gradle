plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

// The version comes from git, not from a file: a clean commit tagged v0.1.3 builds "0.1.3", anything
// else "0.1.3+2.g1a2b3c4" (plus ".dirty"), so a test build never passes for a published one.
version = providers.exec {
	commandLine(nl.jeeninga.tafelboem.build.GitVersion.DESCRIBE)
	ignoreExitValue = true
}.standardOutput.asText.map { nl.jeeninga.tafelboem.build.GitVersion.fromDescribe(it) }.get()

loom {
	splitEnvironmentSourceSets()

	mods {
		"tafelboem" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "tafelboem-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// Each GameTest's time, as JUnit XML, for docs/evaluations/faster-tests.md.
loom.runs.named("gameTest") {
	property("fabric-api.gametest.report-file", file("build/reports/gametest-all.xml").absolutePath)
}

// Every GameTest run starts in a fresh world, which the test mod never saves (GameTestHarness).
def deleteGameTestWorld = tasks.register("deleteGameTestWorld", Delete) {
	delete layout.projectDirectory.dir("build/run/gameTest/world")
}
tasks.named("runGameTest") { dependsOn(deleteGameTestWorld) }

configurations {
	// Mods that must sit next to our jar in a player's mods folder.
	deployMods {
		transitive = false
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	deployMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain JUnit for the pure-Java learning core (no Minecraft bootstrap needed).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// --- Distribution to the kids' PCs ---------------------------------------------------------
// The PCs play in a Prism Launcher instance whose packwiz updater reads the public pack repo
// before every launch. `./gradlew publishPack` builds, tests and publishes there, then waits until
// GitHub serves it. Never copy jars into that instance by hand: packwiz manages its mods folder.
def rawPackRepo = "https://raw.githubusercontent.com/${project.pack_repo}"

// The two packwiz jars that go into the Prism instance, pinned and checked.
def packwizInstaller = tasks.register("downloadPackwizInstaller", nl.jeeninga.tafelboem.build.DownloadVerified) {
	url = "https://github.com/packwiz/packwiz-installer/releases/download/v${project.packwiz_installer_version}/packwiz-installer.jar"
	sha256 = project.packwiz_installer_sha256
	output = layout.buildDirectory.file("prism/packwiz-installer.jar")
}
def packwizBootstrap = tasks.register("downloadPackwizBootstrap", nl.jeeninga.tafelboem.build.DownloadVerified) {
	url = "https://github.com/packwiz/packwiz-installer-bootstrap/releases/download/v${project.packwiz_bootstrap_version}/packwiz-installer-bootstrap.jar"
	sha256 = project.packwiz_bootstrap_sha256
	output = layout.buildDirectory.file("prism/packwiz-installer-bootstrap.jar")
}
tasks.register("prismKit") {
	group = "tafelboem"
	description = "Downloads the pinned packwiz jars for the Prism instance into build/prism."
	dependsOn(packwizInstaller, packwizBootstrap)
}

// The instance new PCs import (Prism → Add Instance → Import → URL of this zip in the pack repo).
def prismInstance = tasks.register("prismInstance", nl.jeeninga.tafelboem.build.PrismInstanceZip) {
	group = "tafelboem"
	description = "Builds TafelBoem.zip: a Prism instance that runs packwiz before every launch."
	instanceName = "TafelBoem"
	minecraft = project.minecraft_version
	fabric = project.loader_version
	packUrl = "${rawPackRepo}/main/pack.toml"
	bootstrap = packwizBootstrap.flatMap { it.output }
	installer = packwizInstaller.flatMap { it.output }
	zip = layout.buildDirectory.file("prism/TafelBoem.zip")
}

// Only a clean commit tagged vX.Y.Z is published. The check runs before anything compiles.
def checkRelease = tasks.register("checkRelease", nl.jeeninga.tafelboem.build.CheckRelease) {
	group = "tafelboem"
	description = "Fails unless HEAD is a clean commit tagged with this build's version."
	sourceDir = layout.projectDirectory
	modVersion = project.version.toString()
}
tasks.withType(JavaCompile).configureEach { mustRunAfter(checkRelease) }

tasks.register("publishPack", nl.jeeninga.tafelboem.build.PublishPack) {
	group = "tafelboem"
	description = "Builds, tests and publishes the tagged HEAD to the pack repo; Prism installs it on the next Play."
	dependsOn(checkRelease, "build")
	modJar = tasks.named("jar", Jar).flatMap { it.archiveFile }
	fabricApi.from(configurations.deployMods)
	instanceZip = prismInstance.flatMap { it.zip }
	packDir = layout.projectDirectory.dir(providers.gradleProperty("packDir").orElse("../tafelboem-pack"))
	sourceDir = layout.projectDirectory
	packName = "TafelBoem"
	modVersion = project.version.toString()
	minecraft = project.minecraft_version
	fabric = project.loader_version
	rawUrl = rawPackRepo
}
